    <style>
      /* The same ground as the opening screen the system draws, so the
         handover from one to the other is not a change of colour. */
      body { margin: 0; background: #0B1120; color: white; font-family: sans-serif; }
      #root { min-height: 100vh; }
      .initial-loader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; gap: 1.15rem;
      }
      .initial-loader img {
        width: min(260px, 62vw); height: auto;
        animation: breathe 2.4s ease-in-out infinite;
      }
      .loading-word {
        font-size: 0.85rem; letter-spacing: 0.22em; font-weight: 700;
        color: rgba(255,255,255,0.5);
      }
      .spinner {
        width: 26px; height: 26px; border: 2px solid rgba(32,192,218,0.18);
        border-top-color: #20C0DA; border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader img, .spinner { animation: none; }
      }
    </style>
