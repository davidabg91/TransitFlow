<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TransitFlow">
  <title>TransitFlow</title>
  <defs>
    <linearGradient id="tf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ee0ea"/>
      <stop offset="1" stop-color="#0a8f99"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile: a mark needs its own ground, or it dissolves into whatever
       chrome the browser paints behind a 16px icon. -->
  <rect width="64" height="64" rx="15" fill="url(#tf)"/>

  <!-- Motion lines, then the F of Flow. Three strokes and one letter is all that
       survives at 16 pixels; anything finer turns to mush. -->
  <g fill="#fff">
    <rect x="9"  y="20" width="16" height="5" rx="2.5" opacity=".55"/>
    <rect x="9"  y="30" width="11" height="5" rx="2.5" opacity=".8"/>
    <rect x="9"  y="40" width="7"  height="5" rx="2.5" opacity=".55"/>
    <path d="M30 16h25a3 3 0 0 1 0 6H36v8h15a3 3 0 0 1 0 6H36v12a3 3 0 0 1-6 0V16z"/>
  </g>
</svg>
