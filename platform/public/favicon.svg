<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TransitFlow">
  <title>TransitFlow</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- The site's ground: near-black navy, so the cyan carries the whole mark. -->
  <rect width="64" height="64" rx="15" fill="#0b1120"/>

  <!-- Motion lines. Three, tapering, the way the site's logo trails the bus. -->
  <g fill="#22d3ee">
    <rect x="4"  y="24" width="14" height="3.4" rx="1.7" opacity=".9"/>
    <rect x="7"  y="32" width="11" height="3.4" rx="1.7" opacity=".65"/>
    <rect x="10" y="40" width="8"  height="3.4" rx="1.7" opacity=".4"/>
  </g>

  <!-- Bus in side view. Kept to a body, a window band and two wheels: at 16px
       anything more collapses into a smudge. -->
  <g>
    <path d="M24 17h27a7 7 0 0 1 7 7v20a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3V20a3 3 0 0 1 3-3z" fill="url(#body)"/>

    <!-- Window band, punched out to the tile colour so it reads as glass. -->
    <rect x="26" y="22" width="28" height="9.5" rx="2.4" fill="#0b1120" opacity=".82"/>
    <rect x="37.5" y="22" width="2.4" height="9.5" fill="#0b1120"/>
    <rect x="46" y="22" width="2.4" height="9.5" fill="#0b1120"/>

    <!-- Headlight, at the leading edge. -->
    <rect x="52" y="36" width="5" height="3.6" rx="1.8" fill="#0b1120" opacity=".7"/>
  </g>

  <g fill="#0b1120">
    <circle cx="31" cy="47" r="5.4"/>
    <circle cx="50" cy="47" r="5.4"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="31" cy="47" r="2.6"/>
    <circle cx="50" cy="47" r="2.6"/>
  </g>
</svg>
